[project]
name = "trendcarry"
version = "0.1.0"
description = "Pre-registered trend-following + carry strategy (ETFs)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "yfinance>=0.2.40", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["trendcarry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
